services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      # Defaults are for local development only. Set unique values in .env.
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      HIREAI_DATABASE: hireai
      HIREAI_OWNER_PASSWORD: ${HIREAI_OWNER_PASSWORD:-hireai_owner_dev_only}
      HIREAI_APP_PASSWORD: ${HIREAI_APP_PASSWORD:-hireai_app_dev_only}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: ['readiness']
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    environment:
      MINIO_DEFAULT_BUCKETS: private-resumes
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hireai_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hireai_minio_dev_only}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio_data:/bitnami/minio/data']
  clamav:
    profiles: ['readiness']
    image: clamav/clamav:1.4.3
    ports: ['127.0.0.1:3310:3310']
    volumes: ['clamav_signatures:/var/lib/clamav']
  migrate:
    profiles: ['app']
    build: .
    image: suretek-hireai-backend:local
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      DATABASE_MIGRATION_URL: postgresql://hireai_owner:${HIREAI_OWNER_PASSWORD:-hireai_owner_dev_only}@postgres:5432/hireai
      PGSSLMODE: disable
      BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: 'no'

  api:
    profiles: ['app']
    build: .
    image: suretek-hireai-backend:local
    # Explicit variables prevent the API from receiving the owner URL/password.
    environment:
      DATABASE_URL: postgresql://hireai_app:${HIREAI_APP_PASSWORD:-hireai_app_dev_only}@postgres:5432/hireai
      NODE_ENV: production
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-604800}
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:-disabled}
      EMAIL_DISABLED_ACKNOWLEDGED: ${EMAIL_DISABLED_ACKNOWLEDGED:-false}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-https://localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_USER: ${SMTP_USER:-unused}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-unused}
      SMTP_FROM: ${SMTP_FROM:-verify@example.test}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      HOST: 0.0.0.0
      PORT: '3000'
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      OAUTH_GOOGLE_CALENDAR_CLIENT_ID: ${OAUTH_GOOGLE_CALENDAR_CLIENT_ID:-}
      OAUTH_GOOGLE_CALENDAR_CLIENT_SECRET: ${OAUTH_GOOGLE_CALENDAR_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CALENDAR_CLIENT_ID: ${OAUTH_MICROSOFT_CALENDAR_CLIENT_ID:-}
      OAUTH_MICROSOFT_CALENDAR_CLIENT_SECRET: ${OAUTH_MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      LINKEDIN_JOBS_APPROVED: ${LINKEDIN_JOBS_APPROVED:-}
      LINKEDIN_JOBS_VERSION: ${LINKEDIN_JOBS_VERSION:-}
      INTEGRATION_EMAIL_SMTP_HOST: ${INTEGRATION_EMAIL_SMTP_HOST:-}
      INTEGRATION_EMAIL_SMTP_PORT: ${INTEGRATION_EMAIL_SMTP_PORT:-}
      INTEGRATION_TELEPHONY_TOKEN_URL: ${INTEGRATION_TELEPHONY_TOKEN_URL:-}
      INTEGRATION_CAREERS_CMS_TOKEN_URL: ${INTEGRATION_CAREERS_CMS_TOKEN_URL:-}
      INTEGRATION_E_SIGNATURE_TOKEN_URL: ${INTEGRATION_E_SIGNATURE_TOKEN_URL:-}
      INTEGRATION_HRIS_TOKEN_URL: ${INTEGRATION_HRIS_TOKEN_URL:-}
      INTEGRATION_TELEPHONY_API_KEY_HEADER: ${INTEGRATION_TELEPHONY_API_KEY_HEADER:-}
      INTEGRATION_EMAIL_API_KEY_HEADER: ${INTEGRATION_EMAIL_API_KEY_HEADER:-}
      INTEGRATION_CAREERS_CMS_API_KEY_HEADER: ${INTEGRATION_CAREERS_CMS_API_KEY_HEADER:-}
      INTEGRATION_E_SIGNATURE_API_KEY_HEADER: ${INTEGRATION_E_SIGNATURE_API_KEY_HEADER:-}
      INTEGRATION_HRIS_API_KEY_HEADER: ${INTEGRATION_HRIS_API_KEY_HEADER:-}
      INTEGRATION_TELEPHONY_VERIFY_URL: ${INTEGRATION_TELEPHONY_VERIFY_URL:-}
      INTEGRATION_EMAIL_VERIFY_URL: ${INTEGRATION_EMAIL_VERIFY_URL:-}
      INTEGRATION_CAREERS_CMS_VERIFY_URL: ${INTEGRATION_CAREERS_CMS_VERIFY_URL:-}
      INTEGRATION_E_SIGNATURE_VERIFY_URL: ${INTEGRATION_E_SIGNATURE_VERIFY_URL:-}
      INTEGRATION_HRIS_VERIFY_URL: ${INTEGRATION_HRIS_VERIFY_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OFFER_MAKER_CHECKER: ${OFFER_MAKER_CHECKER:-true}
      INTAKE_NOTICE_VERSION: ${INTAKE_NOTICE_VERSION:-2026-11-v1}
      INTAKE_IP_LIMIT: ${INTAKE_IP_LIMIT:-20}
      INTAKE_EMAIL_LIMIT: ${INTAKE_EMAIL_LIMIT:-5}
      INTAKE_WINDOW_SECONDS: ${INTAKE_WINDOW_SECONDS:-3600}
      CANDIDATE_RETENTION_DAYS: ${CANDIDATE_RETENTION_DAYS:-365}
      RESUME_MAX_BYTES: ${RESUME_MAX_BYTES:-5242880}
      # The API runs in production mode and requires private S3 storage.
      MALWARE_SCANNER: ${MALWARE_SCANNER:?Set MALWARE_SCANNER explicitly}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-5000}
      DOCUMENT_SCAN_MAX_ATTEMPTS: ${DOCUMENT_SCAN_MAX_ATTEMPTS:-3}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-disabled}
      CAPTCHA_DISABLED_ACKNOWLEDGED: ${CAPTCHA_DISABLED_ACKNOWLEDGED:-false}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      TURNSTILE_EXPECTED_ACTION: ${TURNSTILE_EXPECTED_ACTION:-}
      TURNSTILE_TIMEOUT_MS: ${TURNSTILE_TIMEOUT_MS:-5000}
      CONTACT_VERIFICATION_TTL_SECONDS: ${CONTACT_VERIFICATION_TTL_SECONDS:-1800}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RESUME_STORAGE_ALLOW_LOCAL_IN_PRODUCTION: ${RESUME_STORAGE_ALLOW_LOCAL_IN_PRODUCTION:-false}
      RESUME_STORAGE_ROOT: /app/var/private/resumes
      RESUME_STORAGE: ${RESUME_STORAGE:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      CALL_PLANNING_ENABLED: ${CALL_PLANNING_ENABLED:-false}
      CALL_TIMEZONE: ${CALL_TIMEZONE:-Asia/Kolkata}
      CALL_WINDOW_START: ${CALL_WINDOW_START:-09:00}
      CALL_WINDOW_END: ${CALL_WINDOW_END:-18:00}
      PGSSLMODE: disable
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  minio_data:
  clamav_signatures:
  postgres_data:
