name: hireai

x-hardening: &hardening
  read_only: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-api: &api
  <<: *hardening
  image: ${HIREAI_IMAGE:-ghcr.io/amankasyap1997/suretek-hireai}:${IMAGE_TAG:?Set IMAGE_TAG to vMAJOR.MINOR.PATCH}
  user: '1000:1000'
  mem_limit: 768m
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000']
  networks: [backend, egress]
  volumes: ['${DATA_DIR:-/srv/hireai/data}/resumes:/app/var/private/resumes']
  environment: &api-env
    NODE_ENV: production
    DATABASE_URL: postgresql://hireai_app:${HIREAI_APP_PASSWORD:?Set HIREAI_APP_PASSWORD}@postgres:5432/hireai
    INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    OAUTH_GOOGLE_CALENDAR_CLIENT_ID: ${OAUTH_GOOGLE_CALENDAR_CLIENT_ID:-}
    OAUTH_GOOGLE_CALENDAR_CLIENT_SECRET: ${OAUTH_GOOGLE_CALENDAR_CLIENT_SECRET:-}
    OAUTH_MICROSOFT_CALENDAR_CLIENT_ID: ${OAUTH_MICROSOFT_CALENDAR_CLIENT_ID:-}
    OAUTH_MICROSOFT_CALENDAR_CLIENT_SECRET: ${OAUTH_MICROSOFT_CALENDAR_CLIENT_SECRET:-}
    LINKEDIN_JOBS_APPROVED: ${LINKEDIN_JOBS_APPROVED:-}
    LINKEDIN_JOBS_VERSION: ${LINKEDIN_JOBS_VERSION:-}
    INTEGRATION_EMAIL_SMTP_HOST: ${INTEGRATION_EMAIL_SMTP_HOST:-}
    INTEGRATION_EMAIL_SMTP_PORT: ${INTEGRATION_EMAIL_SMTP_PORT:-}
    INTEGRATION_TELEPHONY_TOKEN_URL: ${INTEGRATION_TELEPHONY_TOKEN_URL:-}
    INTEGRATION_CAREERS_CMS_TOKEN_URL: ${INTEGRATION_CAREERS_CMS_TOKEN_URL:-}
    INTEGRATION_E_SIGNATURE_TOKEN_URL: ${INTEGRATION_E_SIGNATURE_TOKEN_URL:-}
    INTEGRATION_HRIS_TOKEN_URL: ${INTEGRATION_HRIS_TOKEN_URL:-}
    INTEGRATION_TELEPHONY_API_KEY_HEADER: ${INTEGRATION_TELEPHONY_API_KEY_HEADER:-}
    INTEGRATION_EMAIL_API_KEY_HEADER: ${INTEGRATION_EMAIL_API_KEY_HEADER:-}
    INTEGRATION_CAREERS_CMS_API_KEY_HEADER: ${INTEGRATION_CAREERS_CMS_API_KEY_HEADER:-}
    INTEGRATION_E_SIGNATURE_API_KEY_HEADER: ${INTEGRATION_E_SIGNATURE_API_KEY_HEADER:-}
    INTEGRATION_HRIS_API_KEY_HEADER: ${INTEGRATION_HRIS_API_KEY_HEADER:-}
    INTEGRATION_TELEPHONY_VERIFY_URL: ${INTEGRATION_TELEPHONY_VERIFY_URL:-}
    INTEGRATION_EMAIL_VERIFY_URL: ${INTEGRATION_EMAIL_VERIFY_URL:-}
    INTEGRATION_CAREERS_CMS_VERIFY_URL: ${INTEGRATION_CAREERS_CMS_VERIFY_URL:-}
    INTEGRATION_E_SIGNATURE_VERIFY_URL: ${INTEGRATION_E_SIGNATURE_VERIFY_URL:-}
    INTEGRATION_HRIS_VERIFY_URL: ${INTEGRATION_HRIS_VERIFY_URL:-}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    TRUST_PROXY: '1'
    CORS_ORIGINS: ${CORS_ORIGINS:?Set exact CORS_ORIGINS}
    SWAGGER_ENABLED: 'false'
    MALWARE_SCANNER: clamav
    CLAMAV_HOST: clamav
    RESUME_STORAGE: ${RESUME_STORAGE:-local}
    RESUME_STORAGE_ROOT: /app/var/private/resumes
    RESUME_STORAGE_ALLOW_LOCAL_IN_PRODUCTION: 'true'
    CAPTCHA_PROVIDER: turnstile
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY}
    TURNSTILE_EXPECTED_HOSTNAME: ${DOMAIN:?Set DOMAIN}
    TURNSTILE_EXPECTED_ACTION: apply
    INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-604800}
    EMAIL_ADAPTER: smtp
    SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
    SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
    SMTP_TIMEOUT_MS: '10000'
    PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:?Set PUBLIC_WEB_BASE_URL}
    INTAKE_NOTICE_VERSION: ${INTAKE_NOTICE_VERSION:-2026-11-v1}
    CANDIDATE_RETENTION_DAYS: ${CANDIDATE_RETENTION_DAYS:-365}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
  caddy:
    <<: *hardening
    image: ${CADDY_IMAGE:-ghcr.io/amankasyap1997/suretek-hireai-caddy}:${IMAGE_TAG:?Set IMAGE_TAG}
    user: '1000:1000'
    mem_limit: 256m
    # High container ports allow binding with all capabilities dropped.
    ports: ['80:8080', '443:8443']
    networks: [edge, backend]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      NO_PROXY: api,localhost,127.0.0.1
      no_proxy: api,localhost,127.0.0.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/srv/hireai/data}/caddy:/data
      - ${DATA_DIR:-/srv/hireai/data}/caddy-config:/config
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000']
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-Y',
          'off',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *api
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  migrate:
    <<: *hardening
    image: ${HIREAI_IMAGE:-ghcr.io/amankasyap1997/suretek-hireai}:${IMAGE_TAG:?Set IMAGE_TAG}
    user: '1000:1000'
    mem_limit: 512m
    restart: 'no'
    profiles: [tools]
    networks: [backend]
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_MIGRATION_URL: postgresql://hireai_owner:${HIREAI_OWNER_PASSWORD:?Set HIREAI_OWNER_PASSWORD}@postgres:5432/hireai
      PGSSLMODE: disable
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: postgres:17-bookworm
    command:
      [
        'postgres',
        '-c',
        'log_min_messages=fatal',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_error_verbosity=terse',
        '-c',
        'log_statement=none',
        '-c',
        'log_parameter_max_length_on_error=0',
      ]
    user: '999:999'
    mem_limit: 1g
    networks: [backend]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      HIREAI_DATABASE: hireai
      HIREAI_OWNER_PASSWORD: ${HIREAI_OWNER_PASSWORD:?Set HIREAI_OWNER_PASSWORD}
      HIREAI_APP_PASSWORD: ${HIREAI_APP_PASSWORD:?Set HIREAI_APP_PASSWORD}
    volumes:
      - ${DATA_DIR:-/srv/hireai/data}/postgres:/var/lib/postgresql/data
      - ../database/init/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=32m,uid=999,gid=999',
        '/var/run/postgresql:rw,noexec,nosuid,size=16m,uid=999,gid=999',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql -X -U postgres -d hireai -Atqc "SELECT 1" >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    <<: *hardening
    image: clamav/clamav:1.5
    user: '100:101'
    mem_limit: 3g
    networks: [backend, egress]
    # Start daemons directly; the root entrypoint performs forbidden chown operations.
    entrypoint: ['/bin/sh', '-ec']
    command: ['freshclam --daemon & exec clamd --foreground=true']
    volumes:
      - ${DATA_DIR:-/srv/hireai/data}/clamav:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - ./freshclam.conf:/etc/clamav/freshclam.conf:ro
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=64m,uid=100,gid=101',
        '/run/clamav:rw,noexec,nosuid,size=16m,uid=100,gid=101',
      ]
    healthcheck:
      test:
        ['CMD-SHELL', 'printf "PING\n" | nc -w 5 127.0.0.1 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  storage:
    <<: *hardening
    # Maintained upstream S3 implementation; never a legacy MinIO image.
    image: chrislusf/seaweedfs:4.06
    profiles: [resume-storage]
    user: '1000:1000'
    mem_limit: 1g
    networks:
      backend:
        aliases: ['${S3_INTERNAL_HOST:-storage}']
    command:
      [
        'server',
        '-dir=/data',
        '-ip=storage',
        '-s3',
        '-s3.config=/run/secrets/s3.json',
        '-s3.cert.file=/run/secrets/s3.crt',
        '-s3.key.file=/run/secrets/s3.key',
      ]
    volumes:
      - ${DATA_DIR:-/srv/hireai/data}/s3:/data
      - ./secrets/s3.json:/run/secrets/s3.json:ro
      - ./secrets/s3.crt:/run/secrets/s3.crt:ro
      - ./secrets/s3.key:/run/secrets/s3.key:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000']
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-Y',
          'off',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9333/cluster/status',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend: { internal: true }
  edge: {}
  # Egress for authenticated SMTP, CAPTCHA and virus signature updates; no host ports.
  egress: {}
