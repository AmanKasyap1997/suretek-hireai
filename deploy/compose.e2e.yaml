name: hireai-console-test
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_DB: postgres
      HIREAI_DATABASE: hireai_test
      HIREAI_OWNER_PASSWORD: ${HIREAI_OWNER_PASSWORD:?}
      HIREAI_APP_PASSWORD: ${HIREAI_APP_PASSWORD:?}
    volumes:
      [
        '../database/init/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 30
  mail:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_SMTP_TLS_CERT: /run/test-mail/cert.pem
      MP_SMTP_TLS_KEY: /run/test-mail/key.pem
      MP_SMTP_REQUIRE_TLS: 'true'
      MP_SMTP_AUTH: e2e-user:e2e-mail-password
    volumes: ['../work/e2e-mail:/run/test-mail:ro']
    ports: ['127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      retries: 30
  migrate:
    build: ..
    image: hireai-console-test
    command: ['node', 'dist/scripts/migrate.js']
    environment: &migration
      NODE_ENV: test
      DATABASE_MIGRATION_URL: postgresql://hireai_owner:${HIREAI_OWNER_PASSWORD}@postgres:5432/hireai_test
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    image: hireai-console-test
    command: ['node', 'dist/scripts/seed-console.js']
    environment:
      <<: *migration
      SEED_PASSWORD: ${SEED_PASSWORD:?}
      SEED_TENANT_ID: ${SEED_TENANT_ID:?}
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    image: hireai-console-test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://hireai_app:${HIREAI_APP_PASSWORD}@postgres:5432/hireai_test
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN_SECONDS: '60'
      CORS_ORIGINS: http://localhost:5173
      EMAIL_ADAPTER: smtp
      SMTP_HOST: mail
      SMTP_PORT: '1025'
      SMTP_SECURE: 'true'
      SMTP_USER: e2e-user
      SMTP_PASSWORD: e2e-mail-password
      SMTP_FROM: invites@console.test
      PUBLIC_WEB_BASE_URL: http://localhost:5173
      NODE_EXTRA_CA_CERTS: /run/test-mail/cert.pem
    ports: ['127.0.0.1:3000:3000']
    volumes: ['../work/e2e-mail:/run/test-mail:ro']
    depends_on:
      seed: { condition: service_completed_successfully }
      mail: { condition: service_healthy }
