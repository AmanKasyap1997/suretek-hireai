name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: hireai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hireai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINIO_TEST_ENDPOINT: http://127.0.0.1:9000
      NODE_ENV: test
      DATABASE_URL: postgresql://hireai_app:ci_app_password@localhost:5432/hireai_test
      DATABASE_MIGRATION_URL: postgresql://hireai_owner:ci_owner_password@localhost:5432/hireai_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci_postgres_password@localhost:5432/hireai_test
      JWT_SECRET: ci-only-isolated-test-secret-0123456789abcdef
      JWT_EXPIRES_IN_SECONDS: '900'
      CALL_PLANNING_ENABLED: 'false'
      CALL_TIMEZONE: Asia/Kolkata
      CALL_WINDOW_START: '09:00'
      CALL_WINDOW_END: '18:00'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2; Node.js 24 action runtime
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0; Node.js 24 action runtime
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check generated enum migrations
        run: npm run enums:check
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Initialize restricted PostgreSQL roles
        run: bash database/init/01-create-roles.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: ci_postgres_password
          POSTGRES_USER: postgres
          POSTGRES_DB: hireai_test
          HIREAI_DATABASE: hireai_test
          HIREAI_OWNER_PASSWORD: ci_owner_password
          HIREAI_APP_PASSWORD: ci_app_password
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Verify migration retries are safe
        run: npm run db:migrate
      - name: Start real MinIO and private test bucket
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 -e MINIO_DEFAULT_BUCKETS=private-resumes -e MINIO_ROOT_USER=hireai_dev -e MINIO_ROOT_PASSWORD=hireai_minio_dev_only bitnamilegacy/minio:2025.7.23-debian-12-r3
          for i in $(seq 1 60); do if docker logs minio 2>&1 | grep -q 'setup finished' && curl -fsS http://127.0.0.1:9000/minio/health/ready; then break; fi; sleep 2; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
      - name: Run tests
        run: npm test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2; Node.js 24 action runtime
      - name: Validate production Compose
        run: |
          cp deploy/ci.env .env
          chmod 600 .env
          docker compose -f deploy/compose.prod.yaml config --quiet
      - name: Shellcheck all scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -path './node_modules' -prune -o -path './.git' -prune -o -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Build production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0; Node.js 24 action runtime
        with:
          context: .
          push: false
          load: false
          tags: suretek-hireai-backend:ci
      - name: Build capability-free production edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.caddy
          push: false
          load: false
          tags: suretek-hireai-caddy:ci
